[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ats-match"
version = "0.1.0"
description = "Pure requirement/claim matching core: BM25, RRF fusion, budgeted greedy coverage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.hatch.build.targets.wheel]
packages = ["ats_match"]
