[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ats-tailor"
version = "0.2.0"
description = "ATS-optimised one-page LaTeX resume generator driven by a YAML content index"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "ats-match",
    "pyyaml",
    "ruamel.yaml",
    "pydantic>=2",
    "sentence-transformers",
    "numpy",
    "jinja2",
    "matplotlib",
    "mcp>=2,<3",
]

[project.optional-dependencies]
mlx = ["mlx-lm"]
rerank = []
dev = ["pytest"]

[project.scripts]
ats-tailor = "ats_tailor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ats_tailor"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ats-match = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/ats-match/tests"]
